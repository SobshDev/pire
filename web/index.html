<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>pire · learn reverse engineering</title>
    <script>
      // Apply the saved theme before anything paints (see src/theme.ts).
      (function () {
        var mode = null;
        try { mode = localStorage.getItem("pire.theme"); } catch (e) {}
        var light = mode === "light" || (mode !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>

  </head>
  <body class="bg-ink text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
