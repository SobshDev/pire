# Production stack for Dokploy: the app (API + built frontend) and its Postgres.
# Set POSTGRES_PASSWORD (URL-safe) and the optional TUTOR_* variables in Dokploy's Environment tab,
# then add the domain to service "app" on port 8080.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pire:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/pire
      COOKIE_SECURE: "true"
      TUTOR_BASE_URL: ${TUTOR_BASE_URL:-}
      TUTOR_API_KEY: ${TUTOR_API_KEY:-}
      TUTOR_MODEL: ${TUTOR_MODEL:-claude-sonnet-4-6}
      TUTOR_MAX_TOKENS: ${TUTOR_MAX_TOKENS:-800}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: pire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pire
    volumes:
      - pire-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pire -d pire"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default

volumes:
  pire-db:
