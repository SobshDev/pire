# Local development database. Production uses a Dokploy Postgres service instead.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pire
      POSTGRES_PASSWORD: pire
      POSTGRES_DB: pire
    ports:
      - "5433:5432"
    volumes:
      - pire-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pire"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pire-db:
